<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ورشة التحقق من الشركات الناشئة — مسرعة الأعمال في الأفلام.">
<meta name="theme-color" content="#0B1A24">
<title>ورشة التحقق من الشركات الناشئة — مسرعة الأعمال في الأفلام</title>

<!-- Every local asset carries ?v=. GitHub Pages serves everything with
     cache-control: max-age=600, so without this a founder can end up holding
     a fresh index.html and a stale journey.js — which does not degrade, it
     throws. BUMP THIS ON EVERY DEPLOY, in both index.html and mentor.html. -->
<link rel="icon" href="assets/images/fba-mark.svg?v=20260728d" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/css/brand.css?v=20260728d">
</head>
<body>

<div class="stage">

  <!-- ===================== شريط الهوية ===================== -->
  <header class="brandbar">
    <div class="column brandbar-inner">
      <div class="brand-lockup">
        <img src="assets/images/fba-mark-light.svg?v=20260728d" alt="" width="26" height="30">
        <span class="brand-name">مسرعة الأعمال في الأفلام</span>
      </div>
      <span class="savestate" data-savestate aria-live="polite"></span>
    </div>
  </header>

  <!-- ===================== التقدّم ===================== -->
  <div class="column">
    <div class="progress" id="progress" hidden>
      <div class="progress-meta">
        <span id="progress-step" aria-live="polite"></span>
        <span id="progress-time"></span>
      </div>
      <div class="progress-track" role="presentation">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="steps" id="progress-steps" aria-hidden="true"></div>
    </div>
  </div>

  <!-- ===================== الشاشات ===================== -->
  <main id="screens">

    <!-- ١ — البحث الصامت. لا اقتراحات، ولا قائمة، ولا كشف لأي اسم. -->
    <section class="screen active" data-screen="search">
      <div class="column screen-body">
        <div style="text-align:center">
          <img class="anim anim-1" src="assets/images/fba-mark-light.svg?v=20260728d" alt=""
               width="42" height="49" style="opacity:.55;margin-bottom:1.8rem">

          <h1 class="anim anim-1">ورشة التحقق من الشركات الناشئة</h1>

          <p class="lede anim anim-2" style="margin-top:1rem">
            ابدأ رحلتك للتحقق من شركتك خلال أقل من ١٠ دقائق
          </p>
        </div>

        <form class="anim anim-3" id="search-form" style="margin-top:2.4rem" novalidate>
          <label class="visually-hidden" for="search-input">اسمك أو اسم شركتك</label>
          <input class="input" id="search-input" type="text" autocomplete="off"
                 autocorrect="off" autocapitalize="off" spellcheck="false"
                 enterkeyhint="next" placeholder="اكتب اسمك أو اسم شركتك">

          <p class="field-error" id="search-error" role="alert"></p>

          <div class="actions">
            <button class="btn btn--primary" id="search-submit" type="submit">التالي</button>
          </div>
        </form>
      </div>
    </section>

    <!-- ٢ — التحليل. خطوات حقيقية تجري فعلاً، لا انتظار مصطنع. -->
    <section class="screen" data-screen="analyzing">
      <div class="column screen-body" id="analyzing"></div>
    </section>

    <!-- ٣ — ما نعرفه عن شركتك، قبل أي سؤال -->
    <section class="screen" data-screen="welcome">
      <div class="column screen-body" id="welcome"></div>
    </section>

    <!-- الخطوة ١ — مرحلتك الحالية -->
    <section class="screen" data-screen="stage">
      <div class="column screen-body" id="stage"></div>
    </section>

    <!-- الخطوة ٢ — التحقق من الفرضيات -->
    <section class="screen" data-screen="assumptions">
      <div class="column screen-body" id="assumptions"></div>
    </section>

    <!-- الخطوة ٣ — تحديك الحالي -->
    <section class="screen" data-screen="challenge">
      <div class="column screen-body" id="challenge"></div>
    </section>

    <!-- الخطوة ٤ — التوصيات -->
    <section class="screen" data-screen="insights">
      <div class="column screen-body" id="insights"></div>
    </section>

    <!-- الخطوة ٥ — التزامك -->
    <section class="screen" data-screen="commitment">
      <div class="column screen-body" id="commitment"></div>
    </section>

    <!-- النهاية -->
    <section class="screen" data-screen="done">
      <div class="column screen-body" id="done"></div>
    </section>

  </main>

  <footer class="column" style="padding-top:1rem;padding-bottom:2rem;text-align:center">
    <img src="assets/images/film-commission-light.svg?v=20260728d" alt="هيئة الأفلام"
         style="height:20px;width:auto;opacity:.32">
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/js/config.js?v=20260728d"></script>
<script src="assets/js/api.js?v=20260728d"></script>
<script src="assets/js/search.js?v=20260728d"></script>
<script src="assets/js/storage.js?v=20260728d"></script>
<script src="assets/js/ui.js?v=20260728d"></script>
<script src="assets/js/recommend.js?v=20260728d"></script>
<script src="assets/js/journey.js?v=20260728d"></script>
</body>
</html>
