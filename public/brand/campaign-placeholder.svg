<?xml version="1.0" encoding="UTF-8"?>
<!--
  PLACEHOLDER ASSET — NOT FINAL ARTWORK.

  This film-strip / gradient panel fills the cinematic half of the auth
  split-screen. It exists only because no approved campaign photograph was
  supplied with the repository.

  TO REPLACE: drop the approved campaign photo at public/brand/campaign.jpg
  and point NEXT_PUBLIC_CAMPAIGN_IMAGE at it (see .env.example). The auth
  visual panel reads that variable and falls back to this file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600" role="img" aria-label="Placeholder campaign visual">
  <defs>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2837"/>
      <stop offset="46%" stop-color="#16394c"/>
      <stop offset="100%" stop-color="#071119"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBAE40" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#F89C49" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FBAE40" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="beam" cx="0.22" cy="0.14" r="0.85">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="perf" x="0" y="0" width="1200" height="120" patternUnits="userSpaceOnUse">
      <rect x="34" y="38" width="52" height="44" rx="10" fill="#FFFFFF" opacity="0.14"/>
      <rect x="1114" y="38" width="52" height="44" rx="10" fill="#FFFFFF" opacity="0.14"/>
    </pattern>
  </defs>

  <rect width="1200" height="1600" fill="url(#plane)"/>
  <rect width="1200" height="1600" fill="url(#beam)"/>

  <!-- Frame cells, the film strip itself -->
  <g opacity="0.9">
    <rect x="150" y="150" width="900" height="380" rx="26" fill="#FFFFFF" opacity="0.045"/>
    <rect x="150" y="570" width="900" height="380" rx="26" fill="#FFFFFF" opacity="0.075"/>
    <rect x="150" y="990" width="900" height="380" rx="26" fill="#FFFFFF" opacity="0.045"/>
  </g>

  <!-- Film Commission strip colours, used as accents only -->
  <g opacity="0.55">
    <rect x="150" y="150" width="900" height="6" fill="#76B6B7"/>
    <rect x="150" y="570" width="900" height="6" fill="#FBAE40"/>
    <rect x="150" y="990" width="900" height="6" fill="#F05B4E"/>
  </g>

  <rect width="1200" height="1600" fill="url(#perf)"/>
  <rect width="1200" height="1600" fill="url(#warm)"/>

  <g fill="#FFFFFF" opacity="0.28" font-family="system-ui, sans-serif" font-size="26" letter-spacing="6">
    <text x="150" y="1470">PLACEHOLDER VISUAL — AWAITING APPROVED CAMPAIGN PHOTOGRAPHY</text>
  </g>
</svg>
