<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="لوحة المدرب — عرض مجهول لنتائج ورشة التحقق.">
<meta name="theme-color" content="#0B1A24">
<title>لوحة المدرب — مسرعة الأعمال في الأفلام</title>

<link rel="icon" href="assets/images/fba-mark.svg?v=20260729a" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/css/brand.css?v=20260729a">
</head>
<body>

<!-- ===================== البوابة ===================== -->
<section class="gate" id="gate">
  <div class="column" style="max-width:26rem">
    <div class="card anim anim-1" style="text-align:center">
      <img src="assets/images/fba-mark-light.svg?v=20260729a" alt="" width="38" height="44"
           style="opacity:.6;margin-bottom:1.4rem">

      <h2 style="margin-bottom:.6rem">لوحة المدرب</h2>
      <p class="lede" style="font-size:.95rem;margin-bottom:1.8rem">
        عرض مجهول لنتائج القاعة. بدون أسماء شركات، وبدون أسماء مؤسسين.
      </p>

      <form id="gate-form" autocomplete="off">
        <label class="field-label" for="gate-password">كلمة المرور</label>
        <input class="input" id="gate-password" type="password"
               placeholder="أدخل كلمة المرور" autocomplete="current-password"
               style="text-align:center">
        <p class="field-error" id="gate-error" role="alert"></p>
        <div class="actions">
          <button class="btn btn--primary" type="submit">فتح اللوحة</button>
        </div>
      </form>

      <p class="muted" style="font-size:.78rem;margin-top:1.6rem;line-height:1.7">
        هذه البوابة تُبقي اللوحة بعيدة عن المشاركين أثناء الورشة.
        وهي تحقق في المتصفح فقط، وليست حاجزاً أمنياً.
      </p>

      <a href="index.html" class="btn-back" style="margin-top:1rem;display:inline-block">
        ← رحلة المشاركين
      </a>
    </div>
  </div>
</section>

<!-- ===================== اللوحة ===================== -->
<div class="stage" id="dash" hidden>

  <header class="brandbar">
    <div class="column column--wide brandbar-inner">
      <div class="brand-lockup">
        <img src="assets/images/fba-mark-light.svg?v=20260729a" alt="" width="26" height="30">
        <span class="brand-name">لوحة المدرب</span>
      </div>
      <div style="display:flex;gap:.5rem;align-items:center">
        <span class="badge" id="live" aria-live="polite"><span class="badge-dot"></span></span>
        <button class="btn-back" id="refresh">↻ تحديث</button>
      </div>
    </div>
  </header>

  <main class="column column--wide" style="padding-top:1.5rem;padding-bottom:3rem">
    <h1 class="anim anim-1" style="margin-bottom:1.8rem">نتائج الورشة</h1>
    <div id="content"></div>

    <footer style="text-align:center;padding-top:1.5rem">
      <img src="assets/images/film-commission-light.svg?v=20260729a" alt="هيئة الأفلام"
           style="height:20px;width:auto;opacity:.32">
    </footer>
  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.9/dist/umd/supabase.min.js"></script>
<script src="assets/js/config.js?v=20260729a"></script>
<script src="assets/js/api.js?v=20260729a"></script>
<script src="assets/js/session.js?v=20260729a"></script>
<script src="assets/js/storage.js?v=20260729a"></script>
<script src="assets/js/ui.js?v=20260729a"></script>
<script src="assets/js/mentor.js?v=20260729a"></script>
</body>
</html>
